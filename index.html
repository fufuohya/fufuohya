<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>法規 × AI 自動化｜作品集</title>
  <meta name="description" content="9 年以上食品與化妝品法規經驗，專長將複雜法規轉譯為 AI 與程式可執行的檢核邏輯。作品集含營養標示製作、法規查詢平台、PDF 文件處理等 12 件實戰工具。" />
  <meta name="theme-color" content="#ffffff" />

  <script>
    // 提早套用主題，避免載入時的亮暗閃爍
    (function () {
      try {
        var stored = localStorage.getItem('portfolio_theme') || 'auto';
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored === 'auto' ? (isDark ? 'dark' : 'light') : stored);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg: #ffffff;
      --fg: #0a0a0a;
      --muted: #767676;
      --faint: #a8a8a8;
      --rule: rgba(10,10,10,.13);
      --rule-strong: rgba(10,10,10,.85);
      --accent: #e4322b;
      --hover-bg: rgba(10,10,10,.03);

      --max: 1360px;
      --gutter: clamp(20px, 5vw, 64px);
      --sans: 'Inter', 'Noto Sans TC', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    }

    [data-theme="dark"]{
      --bg: #0b0b0b;
      --fg: #f4f4f4;
      --muted: #8e8e8e;
      --faint: #5f5f5f;
      --rule: rgba(244,244,244,.15);
      --rule-strong: rgba(244,244,244,.85);
      --accent: #ff4b3e;
      --hover-bg: rgba(244,244,244,.04);
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }
    html{ scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body{
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection{ background: var(--accent); color: #fff; }

    .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

    .label{
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .accent{ color: var(--accent); }

    /* ---------- Masthead ---------- */

    .masthead{
      position: sticky; top: 0; z-index: 60;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
    }

    .masthead-inner{
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 24px; padding: 18px 0 16px;
    }

    .wordmark{
      font-size: 15px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: var(--fg);
      text-decoration: none; white-space: nowrap;
    }

    .masthead-nav{ display: flex; align-items: baseline; gap: clamp(12px, 2.2vw, 30px); }

    .navlink{
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      transition: color .15s ease; white-space: nowrap;
    }

    .navlink:hover{ color: var(--accent); }

    @media (max-width: 760px){
      .navlink[data-optional="true"]{ display: none; }
    }

    /* ---------- Colophon ---------- */

    .colophon{
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .colophon span{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .colophon span:last-child{ text-align: right; }

    /* ---------- Sections ---------- */

    .section{ padding: clamp(52px, 8vw, 112px) 0; border-top: 1px solid var(--rule-strong); }

    .sectionhead{
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr);
      gap: clamp(20px, 4vw, 56px);
      align-items: baseline;
      margin-bottom: clamp(32px, 5vw, 64px);
    }

    .sectionhead h2{
      font-size: clamp(25px, 3.6vw, 46px);
      font-weight: 600; letter-spacing: -.03em; line-height: 1.15;
    }

    .sectionhead p{
      grid-column: 2; margin-top: 14px;
      color: var(--muted); max-width: 48ch; font-size: 15px;
    }

    /* ---------- Hero ---------- */

    .hero{
      padding: clamp(44px, 8vw, 104px) 0 clamp(40px, 6vw, 76px);
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: clamp(32px, 6vw, 80px);
      align-items: start;
    }

    .hero-eyebrow{ display: block; margin-bottom: clamp(18px, 3vw, 30px); color: var(--accent); }

    .hero h1{
      font-size: clamp(42px, 8.4vw, 112px);
      font-weight: 800; line-height: 1.0; letter-spacing: -.04em;
      margin-bottom: 10px;
    }

    .hero-nameen{
      font-size: clamp(13px, 1.6vw, 17px); font-weight: 500;
      letter-spacing: .22em; text-transform: uppercase;
      color: var(--faint); margin-bottom: clamp(24px, 4vw, 40px);
    }

    .hero-role{
      font-size: clamp(17px, 2.2vw, 26px);
      font-weight: 600; letter-spacing: -.02em; line-height: 1.4;
      padding-top: 22px; border-top: 1px solid var(--rule-strong);
      margin-bottom: 18px;
    }

    .hero-tagline{
      font-size: clamp(15px, 1.5vw, 17px); line-height: 1.65;
      color: var(--muted); max-width: 44ch; margin-bottom: 32px;
    }

    .actions{ display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: center; }

    .openlink{
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 13px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fg); text-decoration: none;
      border-bottom: 2px solid var(--accent); padding-bottom: 5px;
      background: none; border-left: 0; border-right: 0; border-top: 0;
      cursor: pointer; font-family: inherit;
      transition: color .15s ease, gap .2s ease;
    }
    .openlink:hover{ color: var(--accent); gap: 18px; }

    .openlink.quiet{ border-bottom-color: var(--rule); }
    .openlink.quiet:hover{ border-bottom-color: var(--accent); }

    /* Portrait */
    .portrait{ margin: 0; }

    .portrait img{
      width: 100%; display: block; aspect-ratio: 4 / 5;
      object-fit: cover; border: 1px solid var(--rule);
    }

    .portrait-fallback{
      width: 100%; aspect-ratio: 4 / 5;
      border: 1px dashed var(--rule); display: grid; place-items: center;
      text-align: center; padding: 20px; color: var(--faint);
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase; line-height: 2;
    }

    .portrait figcaption{
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule);
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
    }

    /* ---------- Metrics band ---------- */

    /* auto-fit：METRICS 增減幾筆都不會跑版 */
    .metrics{
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 28px clamp(16px, 2.5vw, 36px);
      border-top: 1px solid var(--rule-strong);
      padding-top: clamp(20px, 3vw, 32px);
    }

    .metric{ padding-bottom: 6px; }

    .metric-value{
      font-size: clamp(30px, 5vw, 60px); font-weight: 800;
      letter-spacing: -.045em; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--accent);
      margin-bottom: 10px;
    }

    .metric-label{ font-size: 14px; font-weight: 600; letter-spacing: -.01em; }

    .metric-note{
      margin-top: 4px; font-size: 11px; letter-spacing: .06em;
      text-transform: uppercase; color: var(--faint);
    }

    /* ---------- Data / fact blocks ---------- */

    .datablock{ display: grid; border-top: 1px solid var(--rule-strong); }

    .datarow{
      display: grid; grid-template-columns: 96px 1fr; gap: 16px;
      padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: baseline;
    }

    .datarow dd{ font-size: 14px; line-height: 1.55; color: var(--fg); }

    /* ---------- About ---------- */

    .about-grid{
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr);
      gap: clamp(24px, 4vw, 56px);
    }

    .about-body{ grid-column: 2; }

    .about-body p{
      font-size: clamp(16px, 1.7vw, 19px); line-height: 1.75;
      max-width: 56ch; margin-bottom: 22px;
    }
    .about-body p:last-of-type{ margin-bottom: 34px; }

    /* ---------- Skills ---------- */

    .skillgrid{
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(24px, 4vw, 52px);
    }

    .skillcol > .label{
      display: block; padding-bottom: 12px;
      border-bottom: 1px solid var(--rule-strong); margin-bottom: 0;
    }

    .skillcol ul{ list-style: none; }

    .skillcol li{
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule);
    }

    .skillname{ font-size: 15px; font-weight: 500; }

    .skillnote{
      font-size: 11px; letter-spacing: .06em; color: var(--faint);
      text-align: right; white-space: nowrap;
    }

    /* ---------- Timeline ---------- */

    .timeline{ display: grid; }

    .tlrow{
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.5fr);
      gap: 12px clamp(20px, 4vw, 52px);
      padding: clamp(22px, 3vw, 34px) 0;
      border-top: 1px solid var(--rule);
      align-items: start;
    }
    .tlrow:last-child{ border-bottom: 1px solid var(--rule); }

    .tlperiod{ font-variant-numeric: tabular-nums; }

    .tlrole{ font-size: clamp(17px, 2vw, 22px); font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
    .tlorg{ margin-top: 6px; font-size: 14px; color: var(--muted); }

    .tlpoints{ list-style: none; display: grid; }

    .tlpoints li{
      display: grid; grid-template-columns: 24px 1fr; gap: 8px;
      font-size: 14.5px; line-height: 1.65; color: var(--muted);
      padding: 5px 0;
    }
    .tlpoints li span:first-child{ color: var(--accent); font-size: 11px; font-weight: 600; padding-top: 4px; }

    /* ---------- Credentials ---------- */

    .credgrid{
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(24px, 4vw, 52px); margin-bottom: clamp(32px, 4vw, 48px);
    }

    .credcol > .label{ display: block; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }

    .credcol ul{ list-style: none; }
    .credcol li{ padding: 14px 0; border-bottom: 1px solid var(--rule); }
    .credmain{ font-size: 15.5px; font-weight: 500; }
    .credsub{ margin-top: 4px; font-size: 13px; color: var(--muted); }

    /* ---------- Filter bar ---------- */

    .filterbar{
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 16px 0; flex-wrap: wrap;
      border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule);
      margin-bottom: 4px;
    }

    .filterset{ display: flex; align-items: baseline; gap: clamp(14px, 2.4vw, 30px); flex-wrap: wrap; }

    .filterbtn{
      background: none; border: 0; padding: 0 0 3px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid transparent;
      transition: color .15s ease, border-color .15s ease;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .filterbtn:hover{ color: var(--fg); }
    .filterbtn[aria-pressed="true"]{ color: var(--fg); border-bottom-color: var(--accent); }
    .filterbtn sup{ font-size: 9px; margin-left: 3px; color: var(--faint); vertical-align: super; }
    .filterbtn[aria-pressed="true"] sup{ color: var(--accent); }

    .searchfield{
      flex: 0 1 260px; display: flex; align-items: baseline; gap: 10px;
      border-bottom: 1px solid var(--rule); padding-bottom: 3px;
      transition: border-color .15s ease;
    }
    .searchfield:focus-within{ border-bottom-color: var(--accent); }
    .searchfield input{
      flex: 1; min-width: 0; border: 0; background: none;
      font-family: inherit; font-size: 13px; color: var(--fg); padding: 0;
    }
    .searchfield input:focus{ outline: none; }
    .searchfield input::placeholder{ color: var(--faint); }

    .clearbtn{
      background: none; border: 0; padding: 0; cursor: pointer;
      font-family: inherit; font-size: 15px; line-height: 1; color: var(--faint);
    }
    .clearbtn:hover{ color: var(--accent); }

    /* ---------- Work index ---------- */

    .workrow{
      border-bottom: 1px solid var(--rule);
      opacity: 0; transform: translateY(8px);
      animation: rowIn .5s cubic-bezier(.22,1,.36,1) forwards;
      animation-delay: calc(var(--i) * 45ms);
    }

    @keyframes rowIn{ to{ opacity: 1; transform: none; } }

    .workhead{
      width: 100%; background: none; border: 0; cursor: pointer;
      font-family: inherit; color: inherit; text-align: left;
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto 40px;
      gap: 16px; align-items: baseline;
      padding: clamp(16px, 2.2vw, 27px) 8px; margin: 0 -8px;
      transition: background-color .18s ease;
    }
    .workhead:hover{ background: var(--hover-bg); }

    .worknum{
      font-size: 12px; font-weight: 600; letter-spacing: .08em;
      color: var(--faint); font-variant-numeric: tabular-nums;
      transition: color .18s ease;
    }
    .workhead:hover .worknum, .workrow.open .worknum{ color: var(--accent); }

    .worktitle{
      font-size: clamp(18px, 2.3vw, 29px); font-weight: 600;
      letter-spacing: -.022em; line-height: 1.22; transition: color .18s ease;
    }
    .workhead:hover .worktitle{ color: var(--accent); }

    /* 收合狀態就能掃到成果，不必逐件展開 */
    .workmetric{
      font-size: 14px; font-weight: 700; color: var(--accent);
      font-variant-numeric: tabular-nums; white-space: nowrap;
      letter-spacing: -.01em; text-align: right; min-width: 52px;
    }

    .workcat{
      font-size: 11px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted); white-space: nowrap;
    }

    .workarrow{
      font-size: 18px; line-height: 1; color: var(--faint); justify-self: end;
      transition: transform .22s cubic-bezier(.22,1,.36,1), color .18s ease;
    }
    .workhead:hover .workarrow{ color: var(--accent); transform: translateX(5px); }
    .workrow.open .workarrow{ color: var(--accent); transform: rotate(90deg); }

    .workpanel{
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) minmax(0, .85fr);
      gap: 16px clamp(24px, 4vw, 56px);
      padding: 4px 0 clamp(30px, 4vw, 50px);
      animation: panelIn .35s cubic-bezier(.22,1,.36,1);
    }

    @keyframes panelIn{ from{ opacity: 0; transform: translateY(-6px); } to{ opacity: 1; transform: none; } }

    .panel-body{ grid-column: 2; }
    .panel-media{ grid-column: 3; }

    .panel-desc{ font-size: 15.5px; line-height: 1.7; max-width: 52ch; margin-bottom: 26px; }

    .panel-section{ margin-bottom: 26px; }
    .panel-section > .label{ display: block; margin-bottom: 12px; }

    .featurelist{ list-style: none; display: grid; }
    .featurelist li{
      display: grid; grid-template-columns: 26px 1fr; gap: 8px;
      padding: 9px 0; border-top: 1px solid var(--rule);
      font-size: 14px; line-height: 1.6; color: var(--muted);
    }
    .featurelist li:last-child{ border-bottom: 1px solid var(--rule); }
    .featurelist li span:first-child{
      color: var(--accent); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    }

    /* 系統組成：名稱 / 技術 / 說明 三欄 */
    .complist{ list-style: none; display: grid; }

    .complist li{
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2px 16px;
      padding: 11px 0;
      border-top: 1px solid var(--rule);
    }
    .complist li:last-child{ border-bottom: 1px solid var(--rule); }

    .comp-name{ font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; }

    .comp-tech{
      font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--accent); text-align: right; align-self: baseline;
    }

    .comp-note{
      grid-column: 1 / -1;
      font-size: 13px; color: var(--muted); line-height: 1.5;
    }

    @media (max-width: 620px){
      .complist li{ grid-template-columns: 1fr; }
      .comp-tech{ text-align: left; }
    }

    .taglist{ display: flex; flex-wrap: wrap; gap: 8px 20px; }
    .taglist li{
      list-style: none; font-size: 11px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    }

    .panel-media figure{ margin: 0; }
    .panel-media img{
      width: 100%; display: block;
      border: 1px solid var(--rule); background: var(--hover-bg);
    }

    .media-fallback{
      aspect-ratio: 4 / 3; border: 1px solid var(--rule);
      display: grid; place-items: center; color: var(--faint);
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    }

    .panel-media figcaption{
      margin-top: 10px; font-size: 11px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--faint);
    }

    .cursorpreview{
      position: fixed; top: 0; left: 0; z-index: 40; width: 300px;
      pointer-events: none; opacity: 0; transition: opacity .22s ease;
      will-change: transform; border: 1px solid var(--rule); background: var(--bg);
    }
    .cursorpreview.show{ opacity: 1; }
    .cursorpreview img{ width: 100%; display: block; }

    .emptystate{ padding: clamp(50px, 10vw, 110px) 0; border-bottom: 1px solid var(--rule); }
    .emptystate h3{
      font-size: clamp(22px, 3.4vw, 36px); font-weight: 600;
      letter-spacing: -.03em; margin: 14px 0 12px;
    }
    .emptystate p{ color: var(--muted); max-width: 40ch; }

    /* ---------- Interactive regulatory portfolio book ---------- */

    .lawbook-shell{
      --book-ink: #24352d;
      --book-muted: #748077;
      --book-line: #d9d8ce;
      --book-paper: #fbfaf5;
      --book-paper-deep: #f1efe5;
      --book-cover: #2d4538;
      --book-gold: #c6b27c;
      --leaf-w: 520px;
      --leaf-h: 650px;
      margin-top: clamp(28px, 5vw, 64px);
      color: var(--book-ink);
    }

    .lawbook-tools{
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; flex-wrap: wrap; margin-bottom: 18px;
    }

    .lawbook-tabs{
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    }

    .lawbook-tab{
      min-height: 38px; padding: 8px 12px;
      border: 1px solid var(--rule); border-radius: 2px;
      background: transparent; color: var(--muted); cursor: pointer;
      font: 600 10px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }
    .lawbook-tab:hover{ color: var(--fg); border-color: var(--rule-strong); }
    .lawbook-tab[aria-pressed="true"]{
      color: #fff; border-color: var(--book-cover); background: var(--book-cover);
    }
    .lawbook-tab sup{ margin-left: 4px; opacity: .65; font-size: 8px; }

    .lawbook-contents{
      display: flex; align-items: center; gap: 10px;
      min-width: min(100%, 260px);
    }
    .lawbook-contents label{ white-space: nowrap; }
    .lawbook-contents select{
      width: 100%; min-height: 38px; padding: 7px 34px 7px 10px;
      border: 1px solid var(--rule); border-radius: 2px;
      background: var(--bg); color: var(--fg); font: 500 12px/1.4 var(--sans);
    }

    .lawbook-stage{
      position: relative; padding: clamp(28px, 5vw, 62px) clamp(14px, 3.8vw, 52px) 24px;
      border: 1px solid #d3d0c4;
      background:
        radial-gradient(circle at 50% 16%, rgba(255,255,255,.92), transparent 42%),
        linear-gradient(145deg, #e9e6dc, #dcd9cf);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      overflow: hidden;
    }

    [data-theme="dark"] .lawbook-stage{
      border-color: #393c38;
      background: radial-gradient(circle at 50% 12%, #333832, transparent 48%), #252925;
    }

    .lawbook-stage::before{
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .25;
      background-image: repeating-linear-gradient(90deg, transparent 0 3px, rgba(54,63,55,.025) 3px 4px);
    }

    .lawbook-deskhead{
      position: relative; z-index: 1;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      max-width: calc(var(--leaf-w) * 2); margin: 0 auto 20px;
      color: #70786f; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    }

    .lawbook-progress{
      width: 116px; height: 2px; overflow: hidden; background: rgba(45,69,56,.16);
    }
    .lawbook-progress span{
      display: block; height: 100%; background: var(--book-cover);
      transition: width .35s cubic-bezier(.22,1,.36,1);
    }

    .lawbook-area{
      position: relative; z-index: 1;
      width: min(100%, calc(var(--leaf-w) * 2)); margin: 0 auto;
    }

    .lawbook{
      position: relative; width: 100%; min-height: var(--leaf-h);
      margin: 0 auto;
      filter: drop-shadow(0 24px 25px rgba(31,42,34,.18));
    }

    .lawbook.is-closed{
      width: 100%;
    }

    .lawbook-spread{
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: var(--leaf-h); perspective: 1600px;
    }

    .lawbook.is-closed .lawbook-spread{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lawbook.is-closed .lawbook-cover{
      grid-column: 1 / -1; width: 50%; justify-self: center;
      border-left: 13px solid #20362a;
    }

    .lawbook-cover{
      position: relative; min-height: var(--leaf-h); padding: 40px 34px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      color: #d3c8ab; border-radius: 2px 6px 6px 2px; overflow: hidden;
      background-color: var(--book-cover);
      background-image:
        radial-gradient(ellipse at var(--light-x, 30%) var(--light-y, 20%), rgba(165,185,137,.16), transparent 62%),
        linear-gradient(90deg, rgba(19,42,32,.58), transparent 8%, rgba(255,255,255,.04) 9%, transparent 12%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px);
      box-shadow: inset 10px 0 12px -10px rgba(15,35,26,.55);
    }

    .lawbook-cover::before{
      content: ''; position: absolute; inset: 24px;
      border: 1px solid rgba(198,178,124,.34); pointer-events: none;
    }

    .lawbook-cover-series{
      position: relative; font-size: 10px; font-weight: 600; letter-spacing: .22em;
      color: #c0c8b8; padding: 8px 0 26px;
    }
    .lawbook-cover-number{
      position: relative; font-size: 10px; letter-spacing: .22em; color: #a5b19c;
      margin-bottom: 34px;
    }
    .lawbook-cover h3{
      position: relative; margin: 0;
      font: 500 clamp(32px, 4.4vw, 44px)/1.62 'Noto Serif TC','PMingLiU',serif;
      letter-spacing: .12em; color: #e5dfcc;
    }
    .lawbook-cover-sub{
      position: relative; margin: 27px 0 34px;
      font: 500 10px/1.9 var(--sans); letter-spacing: .2em; color: #aebba6;
    }
    .lawbook-open{
      position: relative; min-height: 44px; padding: 10px 24px;
      border: 1px solid rgba(198,178,124,.48); border-radius: 2px;
      background: transparent; color: #e0e4d8; cursor: pointer;
      font: 600 11px/1.4 var(--sans); letter-spacing: .12em;
      transition: transform .18s ease, background .18s ease;
    }
    .lawbook-open:hover{ transform: translateY(-2px); background: rgba(255,255,255,.06); }
    .lawbook-cover-author{
      position: relative; margin-top: auto; padding-top: 34px;
      font-size: 9px; font-weight: 600; letter-spacing: .2em; color: #9cae96;
    }

    .lawbook-page{
      position: relative; min-width: 0; min-height: var(--leaf-h);
      padding: 28px 28px 42px; overflow: hidden;
      background:
        linear-gradient(90deg, rgba(70,77,69,.035), transparent 10%, transparent 90%, rgba(70,77,69,.025)),
        var(--book-paper);
      border: 1px solid #d5d2c5;
      transform-origin: right center;
      backface-visibility: hidden;
    }
    .lawbook-page + .lawbook-page{ transform-origin: left center; --turn-angle: -7deg; --turn-x: -10px; }
    .lawbook-page:first-child{ border-radius: 4px 0 0 4px; }
    .lawbook-page:last-child{ border-left: 0; border-radius: 0 4px 4px 0; }
    .lawbook-page:first-child::after{
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 24px;
      background: linear-gradient(90deg, transparent, rgba(63,67,61,.08)); pointer-events: none;
    }
    .lawbook-page:last-child::before{
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 24px;
      background: linear-gradient(90deg, rgba(63,67,61,.08), transparent); pointer-events: none;
    }

    .lawbook-running{
      display: flex; justify-content: space-between; gap: 12px;
      padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--book-line);
      color: var(--book-muted); font-size: 9px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
    }

    .lawbook-picture{
      display: grid; grid-template-rows: auto 1fr auto auto; min-height: var(--leaf-h);
    }
    .lawbook-picture-frame{
      min-height: 0; height: 450px; overflow: hidden; position: relative;
      border: 1px solid #c9c9bf; background: #e8e7df; cursor: zoom-in; touch-action: pan-y;
    }
    .lawbook-picture-frame.is-zoomed{ cursor: grab; touch-action: none; }
    .lawbook-picture-frame.is-dragging{ cursor: grabbing; }
    .lawbook-picture-frame img{
      width: 100%; height: 100%; display: block; object-fit: contain;
      transform-origin: center; user-select: none; -webkit-user-drag: none;
      transition: transform .12s ease-out;
    }
    .lawbook-picture-frame.is-dragging img{ transition: none; }

    .lawbook-image-fallback{
      height: 100%; display: grid; place-items: center; padding: 36px;
      color: #778076; text-align: center;
      background: repeating-linear-gradient(135deg, #f2f1e9 0 12px, #ecebe2 12px 24px);
    }
    .lawbook-image-fallback span{
      padding: 15px 18px; border: 1px solid #b9bcb2;
      font: 600 10px/1.7 var(--sans); letter-spacing: .12em; text-transform: uppercase;
      background: rgba(251,250,245,.82);
    }

    .lawbook-figcaption{
      display: flex; justify-content: space-between; gap: 10px;
      padding: 9px 0 0; color: var(--book-muted); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    }
    .lawbook-zoom{
      display: flex; align-items: center; justify-content: center; gap: 5px;
      margin-top: 12px;
    }
    .lawbook-zoom button{
      min-width: 38px; min-height: 38px; padding: 5px 10px;
      border: 1px solid #d1d5c8; border-radius: 3px;
      background: transparent; color: #56654b; cursor: pointer; font: 600 12px/1 var(--sans);
    }
    .lawbook-zoom button:hover:not(:disabled){ background: #e9ece3; }
    .lawbook-zoom button:disabled{ opacity: .35; cursor: default; }
    .lawbook-zoom output{ min-width: 46px; text-align: center; color: var(--book-muted); font-size: 11px; }
    .lawbook-zoom-note{ margin-top: 5px; color: #8a9182; text-align: center; font-size: 10px; }

    .lawbook-title{
      display: flex; align-items: flex-start; justify-content: space-between; gap: 18px;
      margin-bottom: 20px;
    }
    .lawbook-title h3{
      margin: 0; color: var(--book-ink);
      font: 600 clamp(23px, 2.2vw, 31px)/1.42 'Noto Serif TC','PMingLiU',serif;
      letter-spacing: .02em;
    }
    .lawbook-chapter{ color: #8a9582; font: 400 17px/1.8 Georgia,serif; }
    .lawbook-summary{
      color: #4d5a52; font: 400 14px/1.85 var(--sans); margin-bottom: 22px;
    }
    .lawbook-description-rule{ width: 42px; height: 2px; margin-bottom: 22px; background: #6f806f; }
    .lawbook-description h4{
      margin: 0 0 10px; color: #69776e; font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
    }
    .lawbook-points{ list-style: none; counter-reset: point; display: grid; gap: 0; }
    .lawbook-points li{
      counter-increment: point; display: grid; grid-template-columns: 24px 1fr; gap: 7px;
      padding: 9px 0; border-top: 1px solid var(--book-line);
      color: #3f4d45; font-size: 12.5px; line-height: 1.65;
    }
    .lawbook-points li::before{
      content: counter(point, decimal-leading-zero); color: #889389; font: 500 9px/1.9 var(--sans);
    }
    .lawbook-note{
      margin-top: 16px; padding: 10px 12px; border-left: 2px solid #91a08f;
      background: #f1f2eb; color: #657067; font-size: 11px; line-height: 1.65;
    }
    .lawbook-tags{
      display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 15px;
      color: #78847a; font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }
    .lawbook-link{ margin-top: 18px; }
    .lawbook-folio{
      position: absolute; left: 28px; right: 28px; bottom: 18px;
      display: flex; justify-content: space-between; color: #9a9c94;
      font: 500 9px/1 var(--sans); letter-spacing: .12em;
    }

    .lawbook-arrow{
      position: absolute; z-index: 4; top: 50%; transform: translateY(-50%);
      width: 48px; height: 74px; display: grid; place-items: center;
      border: 1px solid rgba(45,69,56,.38); border-radius: 2px;
      background: rgba(251,250,245,.88); color: var(--book-cover); cursor: pointer;
      font: 400 24px/1 Georgia,serif; box-shadow: 0 7px 18px rgba(40,49,42,.12);
      transition: transform .18s ease, background .18s ease, opacity .18s ease;
      backdrop-filter: blur(7px);
    }
    .lawbook-arrow:hover:not(:disabled){ background: #fff; transform: translateY(-50%) scale(1.05); }
    .lawbook-arrow:disabled{ opacity: .2; cursor: default; }
    .lawbook-arrow--left{ left: -64px; }
    .lawbook-arrow--right{ right: -64px; }

    .lawbook-status{
      position: relative; z-index: 1; max-width: calc(var(--leaf-w) * 2); margin: 18px auto 0;
      display: flex; justify-content: center; align-items: center; min-height: 22px;
      color: #70786f; font-size: 10px; letter-spacing: .08em; text-align: center;
    }

    /* The next spread is mounted underneath before the old paper turns. */
    .lawbook-turn-overlay{
      position: absolute; inset: 0; z-index: 8; pointer-events: none;
      perspective: 1800px; transform-style: preserve-3d;
      animation: lawbookOverlayLifetime .76s linear both;
    }
    .lawbook-turn-overlay .lawbook-spread{
      position: absolute; inset: 0; min-height: var(--leaf-h);
      filter: drop-shadow(0 14px 18px rgba(28,39,31,.12));
    }
    .lawbook-turn-overlay.is-forward .lawbook-page:first-child{
      animation: lawbookOldLeft .76s cubic-bezier(.45,0,.2,1) both;
    }
    .lawbook-turn-overlay.is-forward .lawbook-page:last-child{
      z-index: 3; transform-origin: left center;
      animation: lawbookTurnForward .76s cubic-bezier(.45,0,.2,1) both;
    }
    .lawbook-turn-overlay.is-backward .lawbook-page:first-child{
      z-index: 3; transform-origin: right center;
      animation: lawbookTurnBackward .76s cubic-bezier(.45,0,.2,1) both;
    }
    .lawbook-turn-overlay.is-backward .lawbook-page:last-child{
      animation: lawbookOldRight .76s cubic-bezier(.45,0,.2,1) both;
    }
    .lawbook-turn-overlay.is-cover{
      display: grid; place-items: center;
      background: linear-gradient(145deg, #e9e6dc, #dcd9cf);
      animation: lawbookCoverShield .78s cubic-bezier(.45,0,.2,1) both;
    }
    [data-theme="dark"] .lawbook-turn-overlay.is-cover{
      background: radial-gradient(circle at 50% 12%, #333832, transparent 48%), #252925;
    }
    .lawbook-turn-overlay.is-cover .lawbook-cover{
      width: 50%; height: 100%; min-height: var(--leaf-h);
      border-left: 13px solid #20362a;
      transform-origin: left center;
      animation: lawbookOpenCover .78s cubic-bezier(.45,0,.2,1) both;
    }

    @keyframes lawbookOverlayLifetime{ from{ visibility: visible; } to{ visibility: visible; } }
    @keyframes lawbookOldLeft{
      0%, 42%{ opacity: 1; filter: brightness(1); }
      72%, 100%{ opacity: 0; filter: brightness(.96); }
    }
    @keyframes lawbookOldRight{
      0%, 42%{ opacity: 1; filter: brightness(1); }
      72%, 100%{ opacity: 0; filter: brightness(.96); }
    }
    @keyframes lawbookTurnForward{
      0%{ transform: rotateY(0deg); filter: brightness(1); box-shadow: none; opacity: 1; }
      48%{ filter: brightness(.8); box-shadow: -18px 8px 28px rgba(30,40,33,.2); opacity: 1; }
      100%{ transform: rotateY(-178deg); filter: brightness(.95); box-shadow: -3px 3px 8px rgba(30,40,33,.08); opacity: 0; }
    }
    @keyframes lawbookTurnBackward{
      0%{ transform: rotateY(0deg); filter: brightness(1); box-shadow: none; opacity: 1; }
      48%{ filter: brightness(.8); box-shadow: 18px 8px 28px rgba(30,40,33,.2); opacity: 1; }
      100%{ transform: rotateY(178deg); filter: brightness(.95); box-shadow: 3px 3px 8px rgba(30,40,33,.08); opacity: 0; }
    }
    @keyframes lawbookCoverShield{
      0%, 28%{ background-color: transparent; }
      72%, 100%{ background: transparent; }
    }
    @keyframes lawbookOpenCover{
      0%{ transform: translateX(0) rotateY(0deg); filter: brightness(1); opacity: 1; }
      48%{ transform: translateX(-22%) rotateY(-82deg); filter: brightness(.72); opacity: 1; }
      100%{ transform: translateX(-50%) rotateY(-178deg); filter: brightness(.92); opacity: 0; }
    }

    @media (max-width: 1180px){
      .lawbook-area{ width: calc(100% - 88px); }
      .lawbook-arrow--left{ left: -50px; }
      .lawbook-arrow--right{ right: -50px; }
    }

    @media (max-width: 760px){
      .lawbook-shell{ --leaf-h: auto; }
      .lawbook-tools{ align-items: stretch; }
      .lawbook-contents{ width: 100%; }
      .lawbook-stage{ padding: 18px 12px 76px; overflow: visible; }
      .lawbook-deskhead{ font-size: 8px; letter-spacing: .08em; }
      .lawbook-area{ width: 100%; }
      .lawbook, .lawbook.is-closed{ width: 100%; min-height: 0; }
      .lawbook-spread{ grid-template-columns: 1fr; min-height: 0; }
      .lawbook.is-closed .lawbook-spread{ grid-template-columns: 1fr; }
      .lawbook.is-closed .lawbook-cover{ grid-column: 1; width: 100%; }
      .lawbook-page, .lawbook-cover{ min-height: 560px; padding: 24px 22px 42px; }
      .lawbook-page:last-child{ border-left: 1px solid #d5d2c5; border-top: 0; border-radius: 0 0 4px 4px; }
      .lawbook-page:first-child{ border-radius: 4px 4px 0 0; }
      .lawbook-picture-frame{ height: 430px; }
      .lawbook-arrow{ top: auto; bottom: -60px; transform: none; width: 64px; height: 44px; }
      .lawbook-arrow:hover:not(:disabled){ transform: scale(1.04); }
      .lawbook-arrow--left{ left: calc(50% - 76px); }
      .lawbook-arrow--right{ right: calc(50% - 76px); }
      .lawbook-status{ margin-top: 76px; }
      .lawbook-cover h3{ font-size: 34px; }
      .lawbook-turn-overlay .lawbook-spread{ position: absolute; display: block; overflow: hidden; }
      .lawbook-turn-overlay .lawbook-page{ position: absolute; inset: 0; }
      .lawbook-turn-overlay .lawbook-page:last-child{ display: none; }
      .lawbook-turn-overlay.is-backward .lawbook-page:first-child{ animation: lawbookTurnBackward .62s cubic-bezier(.45,0,.2,1) both; }
      .lawbook-turn-overlay.is-forward .lawbook-page:first-child{ animation: lawbookTurnForward .62s cubic-bezier(.45,0,.2,1) both; }
      .lawbook-turn-overlay.is-cover .lawbook-cover{ width: 100%; }
    }

    @media (max-width: 480px){
      .lawbook-tabs{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); width: 100%; }
      .lawbook-tab{ width: 100%; }
      .lawbook-cover, .lawbook-page{ min-height: 520px; }
      .lawbook-picture-frame{ height: 360px; }
      .lawbook-title h3{ font-size: 24px; }
    }

    @media (pointer: coarse){
      .lawbook-tab, .lawbook-zoom button{ min-height: 44px; min-width: 44px; }
    }

    /* ---------- Contact ---------- */

      .hero .portrait{ max-width: 340px; }
      .colophon{ grid-template-columns: repeat(2, 1fr); gap: 6px 20px; }
      .colophon span:nth-child(2){ text-align: right; }
      .sectionhead{ grid-template-columns: 1fr; }
      .sectionhead h2, .sectionhead p{ grid-column: 1; }
      .about-grid{ grid-template-columns: 1fr; }
      .about-body{ grid-column: 1; }
      .skillgrid{ grid-template-columns: 1fr; }
      .tlrow{ grid-template-columns: 1fr; }
      .credgrid{ grid-template-columns: 1fr; }
      .metric-value{ font-size: clamp(28px, 8vw, 44px); }
      .workpanel{ grid-template-columns: 1fr; }
      .panel-body, .panel-media{ grid-column: 1; }
      .panel-media{ margin-top: 8px; }
      .contactrow{ grid-template-columns: 1fr auto; }
      .contactrow .label{ grid-column: 1 / -1; }

    @media (max-width: 620px){

      .workarrow{ grid-column: 3; grid-row: 1; }

      .datarow{ grid-template-columns: 80px 1fr; }

    .section[id], #work, #about, #skills, #experience, #credentials, #contact{

    @media (hover: none){

      .workrow.open .worknum{ color: var(--accent); }

      .navlink:active,
      .openlink:active,

        align-items: center;

    .resume-overlay{

    .resume{

    .resume .sectionhead{ grid-template-columns: 1fr; }
    .resume .sectionhead h2, .resume .sectionhead p{ grid-column: 1; }
    .resume .sectionhead h2{ font-size: clamp(24px, 3vw, 34px); }
    .resume .about-grid{ grid-template-columns: 1fr; }
    .resume .about-body{ grid-column: 1; }
    .resume .skillgrid, .resume .credgrid{ grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .resume .metric-value{ font-size: clamp(28px, 4vw, 44px); }

    .resume .openlink{ color: #20332a; border-bottom-color: #9c4b3f; }

    @media (max-width: 760px){
      .resume{ border-left: 0; }
      .resume-index{ top: 65px; overflow-x: auto; flex-wrap: nowrap; }
      .resume-index-note{ display: none; }
      .resume .hero{ grid-template-columns: 1fr; }
      .resume .tlrow{ grid-template-columns: 1fr; }
    }

    @media (hover: none){
      .resumebtn:hover{ color: var(--fg); border-color: var(--rule-strong); }
      .closebtn:hover{ color: var(--fg); }
    }
    @media (pointer: coarse){
      .resumebtn{ min-height: 44px; }
      .resumebtn:active, .closebtn:active{ color: var(--accent); }

    /* 底部提醒條避開瀏海機的安全區 */
    .draftbar{
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation: none !important; transition: none !important; }
      .workrow{ opacity: 1; transform: none; }
    }
  </style>
</head>

    // 遞迴掃描資料物件，計算還有幾處含 ✎ 的未填欄位
    function countTodos(value) {
      if (typeof value === 'string') return value.includes(TODO) ? 1 : 0;
      if (Array.isArray(value)) return value.reduce((n, v) => n + countTodos(v), 0);
      if (value && typeof value === 'object') {
        return Object.values(value).reduce((n, v) => n + countTodos(v), 0);
      }
      return 0;
    }

    /* ================= Hooks ================= */

    function useImage(src) {
      const [state, setState] = useState({ src: null, done: false });
      useEffect(() => {
        if (!src) { setState({ src: null, done: true }); return; }
        let cancelled = false;
        setState({ src: null, done: false });
        const img = new Image();
        img.onload = () => { if (!cancelled) setState({ src: encodeURI(src), done: true }); };
        img.onerror = () => { if (!cancelled) setState({ src: null, done: true }); };
        img.src = encodeURI(src);
        return () => { cancelled = true; };
      }, [src]);
      return state;
    }

    // 先試 data-cover，失敗才回退到 assets/works/<slug>/cover.*
    function useCoverImage(explicit, slug) {
      const [state, setState] = useState({ src: null, done: false });

      useEffect(() => {
        let cancelled = false;
        setState({ src: null, done: false });

        const tryLoad = (url) => new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = encodeURI(url);
        });

        // cover 明確為 null 者（內部專案無截圖）直接跳過，避免無謂的 404 請求
        if (!explicit) { setState({ src: null, done: true }); return; }

        (async () => {
          const candidates = [explicit];
          // 指定路徑失敗才回退到 assets/works/<slug>/cover.*
          if (slug) for (const ext of ['webp', 'jpg', 'png', 'gif']) {
            candidates.push(`./assets/works/${slug}/cover.${ext}`);
          }
          for (const url of candidates) {
            const ok = await tryLoad(url);
            if (cancelled) return;
            if (ok) { setState({ src: encodeURI(url), done: true }); return; }
          }
          if (!cancelled) setState({ src: null, done: true });
        })();

        return () => { cancelled = true; };
      }, [explicit, slug]);

      return state;
    }

    function useDesktopHover() {
      const [ok, setOk] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 1024px)');
        const update = () => setOk(mq.matches);
        update();
        mq.addEventListener('change', update);
        return () => mq.removeEventListener('change', update);
      }, []);
      return ok;
    }

    function CursorPreview({ src, active }) {
      const elRef = useRef(null);
      const target = useRef({ x: 0, y: 0 });
      const pos = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const onMove = (e) => {
          const w = 300, h = 230, gap = 24;
          let x = e.clientX + gap;
          let y = e.clientY + gap;
          if (x + w > window.innerWidth) x = e.clientX - w - gap;
          if (y + h > window.innerHeight) y = window.innerHeight - h - gap;
          target.current = { x, y };
        };
        window.addEventListener('mousemove', onMove);

        let raf;
        const tick = () => {
          pos.current.x += (target.current.x - pos.current.x) * 0.18;
          pos.current.y += (target.current.y - pos.current.y) * 0.18;
          if (elRef.current) {
            elRef.current.style.transform =
              `translate3d(${pos.current.x.toFixed(1)}px, ${pos.current.y.toFixed(1)}px, 0)`;
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);

        return () => { window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
      }, []);

      return (
        <div ref={elRef} className={`cursorpreview${active && src ? ' show' : ''}`} aria-hidden="true">
          {src && <img src={src} alt="" />}
        </div>
      );
    }

    function BookImage({ work }) {
      const { src, done } = useCoverImage(work.cover, work.slug);
      const frameRef = useRef(null);
      const dragRef = useRef(null);
      const [zoom, setZoom] = useState({ scale: 1, x: 0, y: 0, dragging: false });

      useEffect(() => {
        setZoom({ scale: 1, x: 0, y: 0, dragging: false });
        dragRef.current = null;
      }, [work.slug]);

      const clampPosition = useCallback((next) => {
        const frame = frameRef.current;
        if (!frame) return next;
        const maxX = frame.clientWidth * (next.scale - 1) / 2;
        const maxY = frame.clientHeight * (next.scale - 1) / 2;
        return {
          ...next,
          x: Math.max(-maxX, Math.min(maxX, next.x)),
          y: Math.max(-maxY, Math.min(maxY, next.y)),
        };
      }, []);

      const setScale = (scale) => setZoom((z) => {
        const nextScale = Math.max(1, Math.min(4, scale));
        return clampPosition({
          ...z,
          scale: nextScale,
          x: nextScale === 1 ? 0 : z.x,
          y: nextScale === 1 ? 0 : z.y,
          dragging: false,
        });
      });

      const onPointerDown = (e) => {
        if (zoom.scale <= 1 || e.button !== 0) return;
        e.preventDefault();
        dragRef.current = { id: e.pointerId, px: e.clientX, py: e.clientY, x: zoom.x, y: zoom.y };
        e.currentTarget.setPointerCapture(e.pointerId);
        setZoom((z) => ({ ...z, dragging: true }));
      };

      const onPointerMove = (e) => {
        const drag = dragRef.current;
        if (!drag || drag.id !== e.pointerId) return;
        setZoom((z) => clampPosition({
          ...z,
          x: drag.x + e.clientX - drag.px,
          y: drag.y + e.clientY - drag.py,
          dragging: true,
        }));
      };

      const stopDrag = (e) => {
        const drag = dragRef.current;
        if (!drag || drag.id !== e.pointerId) return;
        dragRef.current = null;
        setZoom((z) => ({ ...z, dragging: false }));
      };

      return (
        <React.Fragment>
          <div
            ref={frameRef}
            className={`lawbook-picture-frame${zoom.scale > 1 ? ' is-zoomed' : ''}${zoom.dragging ? ' is-dragging' : ''}`}
            onPointerDown={onPointerDown} onPointerMove={onPointerMove}
            onPointerUp={stopDrag} onPointerCancel={stopDrag}
            onDoubleClick={() => setScale(zoom.scale > 1 ? 1 : 2)}
            aria-label="作品圖片，可放大並拖曳查看細節"
          >
            {src ? (
              <img
                src={src} alt={`${work.title}實際畫面`} draggable="false"
                style={{ transform: `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.scale})` }}
              />
            ) : (
              <div className="lawbook-image-fallback">
                <span>{done ? 'Confidential case file\nNo public preview' : 'Loading case file'}</span>
              </div>
            )}
          </div>
          <div className="lawbook-zoom" role="group" aria-label="圖片縮放控制">
            <button type="button" onClick={() => setScale(zoom.scale - .25)} disabled={zoom.scale <= 1} aria-label="縮小圖片">−</button>
            <output aria-live="polite">{Math.round(zoom.scale * 100)}%</output>
            <button type="button" onClick={() => setScale(zoom.scale + .25)} disabled={zoom.scale >= 4} aria-label="放大圖片">＋</button>
            <button type="button" onClick={() => setScale(1)}>還原</button>
          </div>
          <p className="lawbook-zoom-note">100%–400% · 雙擊放大 · 放大後可拖曳</p>
        </React.Fragment>
      );
    }

    function Work() {
      const [filter, setFilter] = useState('all');
      const [page, setPage] = useState(-1);
      const [turn, setTurn] = useState(null);
      const coverRef = useRef(null);

      const counts = useMemo(() => {
        const result = { all: WORKS.length };
        WORKS.forEach((work) => { result[work.category] = (result[work.category] || 0) + 1; });
        return result;
      }, []);

      const filtered = useMemo(
        () => WORKS.filter((work) => filter === 'all' || work.category === filter),
        [filter]
      );

      const selectChapter = (key) => {
        setTurn(null);
        setPage(-1);
        setFilter(key);
      };

      // Animation events can be skipped when a tab is hidden or motion settings change.
      useEffect(() => {
        if (!turn) return;
        const timer = window.setTimeout(() => {
          setPage(turn.to);
          setTurn(null);
        }, 900);
        return () => window.clearTimeout(timer);
      }, [turn]);

      useEffect(() => {
        WORKS.forEach((work) => {
          if (!work.cover) return;
          const image = new Image();
          image.decoding = 'async';
          image.src = encodeURI(work.cover);
        });
      }, []);

      const turnTo = (next) => {
        const max = filtered.length - 1;
        const target = Math.max(-1, Math.min(max, next));
        if (turn || target === page) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setPage(target);
          return;
        }
        setTurn({ from: page, to: target, direction: target > page ? 'forward' : 'backward' });
      };

      const finishTurn = (e) => {
        if (e.target !== e.currentTarget || !turn) return;
        setPage(turn.to);
        setTurn(null);
      };

      const entries = [['all', '全部作品'], ...Object.entries(CATEGORY_META).map(([key, meta]) => [key, meta.label])];
      const visiblePage = turn ? turn.to : page;
      const current = visiblePage >= 0 ? filtered[visiblePage] : null;
      const progress = visiblePage < 0 ? 0 : ((visiblePage + 1) / filtered.length) * 100;

      const moveCoverLight = (e) => {
        if (!coverRef.current || e.pointerType === 'touch' || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const rect = coverRef.current.getBoundingClientRect();
        coverRef.current.style.setProperty('--light-x', `${Math.round((e.clientX - rect.left) / rect.width * 100)}%`);
        coverRef.current.style.setProperty('--light-y', `${Math.round((e.clientY - rect.top) / rect.height * 100)}%`);
      };

      return (
        <section className="section" id="work">
          <div className="wrap">
            <SectionHead
              num="01" en="Selected Work" title="法規實務與自動化作品集"
              note="從法規判讀到流程設計，將實務中的問題，整理成可翻閱的解答。"
            />

            <div className="lawbook-shell" tabIndex={0} role="region" aria-label="作品書，使用左右方向鍵翻頁"
              onKeyDown={(e) => {
                if (e.target.closest('input, select, textarea, button, a')) return;
                if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                  e.preventDefault();
                  turnTo(page + (e.key === 'ArrowRight' ? 1 : -1));
                }
              }}>
              <div className="lawbook-tools">
                <div className="lawbook-tabs" aria-label="作品章節">
                  {entries.map(([key, label]) => (
                    <button
                      key={key} type="button" className="lawbook-tab"
                      aria-pressed={filter === key} onClick={() => selectChapter(key)} disabled={!!turn}
                    >
                      {label}<sup>{pad(counts[key] || 0)}</sup>
                    </button>
                  ))}
                </div>

                <div className="lawbook-contents">
                  <label className="label" htmlFor="lawbook-index">目錄</label>
                  <select
                    id="lawbook-index" value={visiblePage}
                    onChange={(e) => turnTo(Number(e.target.value))}
                    aria-label="直接選擇作品" disabled={!!turn}
                  >
                    <option value={-1}>封面</option>
                    {filtered.map((work, i) => <option value={i} key={work.slug}>{pad(i + 1)}　{work.title}</option>)}
                  </select>
                </div>
              </div>

              <div className="lawbook-stage">
                <div className="lawbook-deskhead">
                  <span>THE PRACTICE COLLECTION <span className="lawbook-edition">／ 第一卷</span></span>
                  <div className="lawbook-progress" aria-label={`閱讀進度 ${Math.round(progress)}%`}><span style={{ width: `${progress}%` }} /></div>
                </div>

                <div className="lawbook-area">
                  <button
                    type="button" className="lawbook-arrow lawbook-arrow--left"
                    aria-label="向左翻頁" disabled={!!turn || visiblePage < 0} onClick={() => turnTo(visiblePage - 1)}
                  >←</button>

                  <div className={`lawbook${visiblePage < 0 ? ' is-closed' : ''}`} aria-busy={!!turn}>
                    {visiblePage < 0 ? (
                      <div className="lawbook-spread">
                        <BookCover coverRef={coverRef} onPointerMove={moveCoverLight} onOpen={() => turnTo(0)} />
                      </div>
                    ) : (
                      <BookSpread work={current} index={visiblePage} total={filtered.length} />
                    )}

                    {turn && (
                      turn.from < 0 ? (
                        <div className="lawbook-turn-overlay is-cover" onAnimationEnd={finishTurn} aria-hidden="true" inert="">
                          <BookCover interactive={false} />
                        </div>
                      ) : (
                        <div
                          className={`lawbook-turn-overlay is-${turn.direction}`}
                          onAnimationEnd={finishTurn} aria-hidden="true"
                          inert=""
                        >
                          <BookSpread work={filtered[turn.from]} index={turn.from} total={filtered.length} />
                        </div>
                      )
                    )}
                  </div>

                  <button
                    type="button" className="lawbook-arrow lawbook-arrow--right"
                    aria-label="向右翻頁" disabled={!!turn || visiblePage >= filtered.length - 1}
                    onClick={() => turnTo(visiblePage + 1)}
                  >→</button>
                </div>

                <div className="lawbook-status" aria-live="polite">
                  {current ? `作品 ${visiblePage + 1} / ${filtered.length} · ${current.title}` : `封面 · ${filter === 'all' ? '完整作品集' : CATEGORY_META[filter].label}`}
                </div>
                <p className="lawbook-reading-hint">左右箭頭翻閱 <span>·</span> 目錄快速跳頁 <span>·</span> 圖片可放大檢視</p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Contact() {
      const email = IDENTITY.show ? IDENTITY.email : '';

      const rows = [
        email            && { label: 'Email',    value: email, href: `mailto:${email}` },
        PROFILE.github   && { label: 'GitHub',   value: PROFILE.github.replace(/^https?:\/\//, ''), href: PROFILE.github },
        PROFILE.linkedin && { label: 'LinkedIn', value: PROFILE.linkedin.replace(/^https?:\/\//, ''), href: PROFILE.linkedin },
        PROFILE.phone    && { label: 'Phone',    value: PROFILE.phone,  href: `tel:${PROFILE.phone.replace(/\s/g, '')}` },
      ].filter(Boolean);

      return (
        <section className="section" id="contact">
          <div className="wrap">
            <SectionHead
              num="02" en="Contact" title="聯絡我"
              note="對食品法規、品保或流程自動化的職缺與合作都歡迎來信。"
            />
            <div className="contact-lines">
              {rows.map((r) => (
                <a
                  className="contactrow" key={r.label} href={r.href}
                  target={r.href.startsWith('http') ? '_blank' : undefined}
                  rel={r.href.startsWith('http') ? 'noopener' : undefined}
                >
                  <span className="label">{r.label}</span>
                  <span className="contactvalue">{r.value}</span>
                  <span className="contactarrow" aria-hidden="true">↗</span>
                </a>
              ))}
            </div>
            {!email && (
              <p style={{ marginTop: 24, color: 'var(--muted)', fontSize: 14 }}>
                目前僅開放 GitHub 聯繫。開放 email 請填寫 IDENTITY.email 並將 show 設為 true。
              </p>
            )}
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <div className="wrap">
            <div className="footer-base label">
              <span>© {new Date().getFullYear()} {IDENTITY.show && IDENTITY.nameEn ? IDENTITY.nameEn : IDENTITY.handle}</span>
              <span>{PROFILE.location}</span>
            </div>
          </div>
        </footer>
      );
    }

    // 只在還有 ✎ 未填欄位時出現，填完自動消失
    function DraftBar({ count }) {
      const [hidden, setHidden] = useState(false);
      if (!count || hidden) return null;
      return (
        <div className="draftbar">
          <span>尚有 {count} 處待填寫（搜尋檔案中的「✎」符號）— 上線前請先補完</span>
          <button type="button" onClick={() => setHidden(true)}>本次隱藏</button>
        </div>
      );
    }

    // 履歷面板：從右側滑出，網址帶 #resume 可直接分享、手機按返回鍵可關閉
    function ResumeDrawer({ open, onClose }) {
      const panelRef = useRef(null);
      const closeRef = useRef(null);

      useEffect(() => {
        if (!open) return;
        const prevFocus = document.activeElement;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        panelRef.current?.scrollTo(0, 0);
        closeRef.current?.focus();

        const onKey = (e) => {
          if (e.key === 'Escape') { onClose(); return; }
          if (e.key !== 'Tab' || !panelRef.current) return;
          // 焦點鎖在面板內
          const items = panelRef.current.querySelectorAll('a[href], button:not([disabled])');
          if (!items.length) return;
          const first = items[0], last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', onKey);

        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = prevOverflow;
          prevFocus?.focus?.();
        };
      }, [open, onClose]);

      if (!open) return null;

      return (
        <div className="resume-overlay" onClick={onClose}>
          <aside
            className="resume" ref={panelRef} role="dialog" aria-modal="true" aria-label="履歷"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="resume-bar">
              <span className="label">Professional Dossier — 專業履歷卷宗</span>
              <div className="resume-bar-actions">
                {PROFILE.resume && (
                  <a className="navlink" href={PROFILE.resume} download>PDF ↓</a>
                )}
                <button type="button" className="closebtn" ref={closeRef} onClick={onClose} aria-label="關閉履歷">×</button>
              </div>
            </div>
            <nav className="resume-index" aria-label="履歷章節">
              {[
                ['about', '摘要'],
                ['skills', '專長'],
                ['experience', '經歷'],
                ['credentials', '學歷與證照'],
              ].map(([id, label]) => (
                <button
                  type="button" key={id}
                  onClick={() => panelRef.current?.querySelector(`#${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
                >{label}</button>
              ))}
              <span className="resume-index-note">快速掃讀 · 成果導向 · 可下載 PDF</span>
            </nav>
            <Hero />
            <About total={WORKS.length} />
            <Skills />
            <Experience />
            <Credentials />
          </aside>
        </div>
      );
    }

    function useResumeHash() {
      const [open, setOpen] = useState(() => window.location.hash === '#resume');
      const pushed = useRef(false);

      useEffect(() => {
        const sync = () => setOpen(window.location.hash === '#resume');
        window.addEventListener('popstate', sync);
        window.addEventListener('hashchange', sync);
        return () => {
          window.removeEventListener('popstate', sync);
          window.removeEventListener('hashchange', sync);
        };
      }, []);

      const openResume = useCallback(() => {
        if (window.location.hash !== '#resume') {
          history.pushState(null, '', '#resume');
          pushed.current = true;
        }
        setOpen(true);
      }, []);

      const closeResume = useCallback(() => {
        if (pushed.current) {
          pushed.current = false;
          history.back();
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
        setOpen(false);
      }, []);

      return [open, openResume, closeResume];
    }

    /* ================= App ================= */

    function App() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('portfolio_theme') || 'auto'; }
        catch (e) { return 'auto'; }
      });
      const [resumeOpen, openResume, closeResume] = useResumeHash();

      useEffect(() => {
        const resolve = (m) =>
          m === 'auto'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : m;

        document.documentElement.setAttribute('data-theme', resolve(theme));
        try { localStorage.setItem('portfolio_theme', theme); } catch (e) {}

        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = () => {
          if (theme === 'auto') document.documentElement.setAttribute('data-theme', resolve('auto'));
        };
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, [theme]);

      const todoCount = useMemo(
        () => countTodos(PROFILE) + countTodos(SKILLS) + countTodos(EXPERIENCE)
            + countTodos(EDUCATION) + countTodos(CERTIFICATES) + countTodos(AI_EDUCATION),
        []
      );

      return (
        <React.Fragment>
          <Masthead
            theme={theme}
            onCycleTheme={() => setTheme((t) => (t === 'auto' ? 'light' : t === 'light' ? 'dark' : 'auto'))}
            onOpenResume={openResume}
          />
          <Colophon total={WORKS.length} />
          <main>
            <Intro onOpenResume={openResume} />
            <Work />
            <Contact />
          </main>
          <Footer />
          <ResumeDrawer open={resumeOpen} onClose={closeResume} />
          <DraftBar count={todoCount} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
